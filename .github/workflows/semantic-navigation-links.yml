name: Semantic navigation links

on:
  push:
    branches:
      - semantic-navigation-links
    paths:
      - scripts/semantic-nav-patch.cjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic-navigation-links

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch navigation
        run: node scripts/semantic-nav-patch.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit result
        run: |
          rm scripts/semantic-nav-patch.cjs
          rm .github/workflows/semantic-navigation-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/semantic-nav-patch.cjs .github/workflows/semantic-navigation-links.yml
          git commit -m "SEO: use semantic internal navigation links"
          git push origin semantic-navigation-links
