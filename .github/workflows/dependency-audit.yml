name: Dependency security fix

on:
  push:
    branches:
      - dependency-audit

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependency-audit
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible security fixes
        run: npm audit fix
      - name: Build site
        run: npm run build
      - name: Verify remaining audit findings
        run: npm audit --json || true
      - name: Commit dependency updates if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update build dependencies for security fixes"
          git push origin dependency-audit
