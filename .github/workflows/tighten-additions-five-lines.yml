name: Tighten additions copy to five lines
on:
  push:
    branches: [preview-three-column-lines]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Apply five-line copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '{ t: "Additions + Renovations", d: "Second-storey additions,\\nmajor renovations, and\\nstructural reconfigurations\\nexecuted with the precision\\nof a new build." }'
          new = '{ t: "Additions + Renovations", d: "Second-storey additions,\\nmajor renovations, and\\nstructural changes\\nplanned with precision\\nfor a new build." }'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit and clean up workflow
        shell: bash
        run: |
          rm .github/workflows/tighten-additions-five-lines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/tighten-additions-five-lines.yml
          git commit -m "Typography: fit additions copy to five lines"
          git push origin HEAD:preview-three-column-lines
