name: Apply Featured Projects correction

on:
  push:
    paths:
      - .github/workflows/apply-featured-projects-correction.yml

permissions:
  contents: write

jobs:
  correct-featured-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply correction
        run: python .github/scripts/apply_featured_projects.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git rm .github/scripts/apply_featured_projects.py
          git rm .github/workflows/apply-featured-projects-correction.yml
          git commit -m "Correct Featured Projects content"
          git push
