name: Adjust additions card copy
on:
  push:
    branches: [preview-three-column-lines]
    paths: ['.github/workflows/adjust-additions-copy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Apply exact copy change
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '{ t: "Additions + Renovations", d: "Second-storey additions,\\nmajor renovations, and\\nstructural reconfigurations\\nwith the same precision\\nas a new build." },'
          new = '{ t: "Additions + Renovations", d: "Second-storey additions,\\nmajor renovations, and\\nstructural reconfigurations\\nexecuted with the precision\\nof a new build." },'
          if old not in s:
              raise SystemExit('Target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/adjust-additions-copy.yml
          git add src/App.jsx .github/workflows/adjust-additions-copy.yml
          git commit -m "Typography: tighten additions card to five lines"
          git push origin preview-three-column-lines
