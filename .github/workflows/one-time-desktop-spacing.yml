name: One-time desktop spacing rhythm

on:
  push:
    branches:
      - desktop-spacing-rhythm

permissions:
  contents: write

jobs:
  adjust-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-spacing-rhythm

      - name: Apply desktop spacing adjustments
        run: python scripts/one_time_desktop_spacing.py

      - name: Verify spacing hooks
        run: |
          grep -q 'className="home-proof-intro"' src/App.jsx
          grep -q 'className="home-design-outcome"' src/App.jsx
          grep -q 'className="home-how-we-work"' src/App.jsx
          grep -q '@media(min-width:861px)' src/App.jsx
          grep -q '.home-stats>div>div' src/App.jsx

      - name: Commit spacing changes if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Tighten desktop homepage section spacing"
          git push origin desktop-spacing-rhythm
