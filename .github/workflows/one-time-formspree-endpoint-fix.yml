name: One-time Formspree endpoint fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-formspree-endpoint-fix.yml"

permissions:
  contents: write

jobs:
  fix-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Formspree endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/App.jsx")
          text = path.read_text(encoding="utf-8")
          old = "https://formspree.io/f/xdayrzaw"
          new = "https://formspree.io/f/xljezpyq"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one old endpoint, found {count}")
          text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit endpoint update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "Update Formspree contact endpoint"
          git push origin HEAD:main
