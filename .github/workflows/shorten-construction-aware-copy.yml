name: Shorten construction-aware copy

on:
  push:
    branches:
      - preview-three-column-lines
    paths:
      - '.github/workflows/shorten-construction-aware-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shorten copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = 'Every drawing is developed with buildability in mind. We coordinate structure, mechanical, and architectural systems during design so the builder receives instructions, not questions.'
          new = 'Every drawing is developed with buildability in mind. We coordinate structure, mechanical, and architectural systems so the builder receives instructions, not questions.'
          if old not in s:
              raise SystemExit('Target copy not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit copy change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/shorten-construction-aware-copy.yml
          git add src/App.jsx .github/workflows/shorten-construction-aware-copy.yml
          git commit -m "Copy: shorten construction-aware design description"
          git push origin HEAD:preview-three-column-lines
