name: AI Concierge regression tests
on:
  pull_request:
    paths:
      - 'src/Concierge.jsx'
      - 'src/Concierge.css'
      - 'src/concierge/**'
      - 'api/concierge.js'
      - 'tests/concierge-*.test.js'
      - '.github/workflows/concierge-tests.yml'
  push:
    branches:
      - 'feature/ai-concierge-pilot'
    paths:
      - 'src/Concierge.jsx'
      - 'src/Concierge.css'
      - 'src/concierge/**'
      - 'api/concierge.js'
      - 'tests/concierge-*.test.js'
      - '.github/workflows/concierge-tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node --test tests/concierge-demo.test.js tests/concierge-api.test.js
      - run: npm run build
