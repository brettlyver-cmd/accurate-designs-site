name: One-time contact validation

on:
  push:
    branches:
      - contact-form-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: contact-form-validation

      - name: Apply contact form validation
        run: python scripts/one_time_contact_validation.py

      - name: Verify expected validation hooks
        run: |
          grep -q 'required={required}' src/App.jsx
          grep -q 'defaultValue=""' src/App.jsx
          grep -q 'invalidField.reportValidity()' src/App.jsx
          grep -q 'htmlFor={fieldId}' src/App.jsx

      - name: Commit validation if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Enforce contact form required fields"
          git push origin contact-form-validation
