name: Balance process bridge copy
on:
  push:
    branches: [preview-three-column-lines]
    paths: ['.github/workflows/balance-process-bridge-copy.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Apply line break
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = 'Beautiful homes do not come from design alone. They come from resolving proportion, structure, budget, code, and construction logic early enough that the finished home still feels like the original vision.'
          new = 'Beautiful homes do not come from design alone. They come from resolving proportion, structure, budget, code, and construction logic early enough that <span className="desktop-newline">the finished home still feels like the original vision.</span>'
          if old not in s:
              raise SystemExit('Target copy not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/balance-process-bridge-copy.yml
          git add src/App.jsx
          git commit -m "Typography: move process bridge ending to next line"
          git push origin preview-three-column-lines
