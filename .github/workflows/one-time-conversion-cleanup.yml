name: One-time conversion cleanup

on:
  push:
    branches:
      - conversion-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion-cleanup

      - name: Apply conversion cleanup
        run: python scripts/one_time_conversion_cleanup.py

      - name: Verify expected cleanup
        run: |
          grep -q "Book a Project Consultation" src/App.jsx
          grep -q 'data-section="early-trust"' src/App.jsx
          grep -q "© 2026 Accurate Designs Inc." src/App.jsx
          ! grep -q "Begin with a Conversation" src/App.jsx

      - name: Commit cleanup if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Standardize conversion CTAs and move trust proof earlier"
          git push origin conversion-cleanup
