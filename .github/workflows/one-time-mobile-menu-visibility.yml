name: One-time mobile menu visibility

on:
  push:
    branches:
      - mobile-menu-visibility-fix-3

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-menu-visibility-fix-3

      - name: Apply mobile menu visibility fix
        run: python scripts/one_time_mobile_menu_visibility.py

      - name: Verify expected menu hooks
        run: |
          grep -q 'zIndex: 1002' src/App.jsx
          grep -q 'flexShrink: 0' src/App.jsx
          grep -q 'background: "#FFFFFF"' src/App.jsx

      - name: Commit fix if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Ensure mobile menu is visible on homepage"
          git push origin mobile-menu-visibility-fix-3
