name: One-time mobile nav fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-mobile-nav-fix.yml"

permissions:
  contents: write

jobs:
  mobile-nav-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile navigation fix
        run: python scripts/apply-mobile-nav-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit mobile navigation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --check
          git commit -m "Keep mobile navigation within viewport"
          git push origin HEAD:main
