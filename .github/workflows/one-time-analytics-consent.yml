name: One-time analytics consent

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-analytics-consent.yml"

permissions:
  contents: write

jobs:
  wire-consent:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consent wiring
        run: python scripts/apply-consent-wiring.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit consent wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx index.html
          git diff --cached --check
          git commit -m "Require opt-in before loading analytics"
          git push origin HEAD:main
