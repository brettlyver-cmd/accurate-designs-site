name: Match planning card title style
on:
  push:
    paths:
      - '.github/workflows/match-planning-title-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Match planning card titles to process headings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '<h4 style={{ ...sf, fontSize: 16, fontWeight: 500, fontStyle: "italic", color: C.smoke, marginBottom: 10 }}>{x.t}</h4>'
          new = '<h4 style={{ ...sn, fontSize: 15, fontWeight: 500, color: C.black, marginBottom: 10 }}>{x.t}</h4>'
          if old not in s:
              raise SystemExit('target style not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit and clean up workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Typography: match planning card titles to process headings"
          git rm .github/workflows/match-planning-title-style.yml
          git commit -m "chore: remove temporary typography workflow"
          git push origin HEAD:preview-three-column-lines