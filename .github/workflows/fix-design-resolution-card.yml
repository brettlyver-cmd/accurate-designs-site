name: Fix Design Resolution card wrapping
on:
  push:
    paths:
      - '.github/workflows/fix-design-resolution-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Update Design Resolution copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = '{ n: "02", t: "Design Resolution", d: "We iterate until every decision\\nis resolved: structure, systems,\\nmaterials, and cost." },'
          new = '{ n: "02", t: "Design Resolution", d: "Decisions are resolved.\\nSystems and structure align.\\nMaterials and cost are set." },'
          if old not in s:
              raise SystemExit('Target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Commit and clean up workflow
        run: |
          rm .github/workflows/fix-design-resolution-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx .github/workflows/fix-design-resolution-card.yml
          git commit -m "Typography: fix Design Resolution card wrapping"
          git push origin HEAD:preview-three-column-lines
