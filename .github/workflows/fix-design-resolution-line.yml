name: Fix Design Resolution line
on:
  push:
    branches: [preview-three-column-lines]
    paths: ['.github/workflows/fix-design-resolution-line.yml']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-three-column-lines
      - name: Update copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='Decisions are resolved.\\nSystems and structure align.\\nMaterials and cost are set.'
          new='Decisions are resolved.\\nStructure and systems align.\\nMaterials and cost are set.'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit and clean up workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-design-resolution-line.yml
          git add src/App.jsx .github/workflows/fix-design-resolution-line.yml
          git commit -m 'Typography: keep Design Resolution to three lines'
          git push origin preview-three-column-lines
