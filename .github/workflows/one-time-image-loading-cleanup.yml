name: One-time image loading cleanup

on:
  push:
    branches:
      - performance-hardening

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: performance-hardening

      - name: Apply image loading optimization
        run: python scripts/one_time_image_loading_cleanup.py

      - name: Verify optimization
        run: |
          grep -q 'loading="lazy"' src/App.jsx
          grep -q 'fetchPriority="high"' src/App.jsx

      - name: Commit optimization if needed
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo "No App.jsx changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Optimize image loading priorities"
          git push origin performance-hardening
