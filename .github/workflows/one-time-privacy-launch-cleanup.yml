name: One-time privacy and launch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-privacy-launch-cleanup.yml"

permissions:
  contents: write

jobs:
  privacy-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add privacy page and website disclosures
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/App.jsx")
          app = app_path.read_text(encoding="utf-8")

          form_old = '''                <p style={{ ...sn, fontSize: 11, fontWeight: 400, color: C.smoke, marginBottom: 32, letterSpacing: 0.3, lineHeight: 1.7 }}>
                  Every inquiry is reviewed personally. We typically reply within one business day.
                </p>
                <Bt'''
          form_new = '''                <p style={{ ...sn, fontSize: 11, fontWeight: 400, color: C.smoke, marginBottom: 12, letterSpacing: 0.3, lineHeight: 1.7 }}>
                  Every inquiry is reviewed personally. We typically reply within one business day.
                </p>
                <p style={{ ...sn, fontSize: 10.5, fontWeight: 400, color: C.muted, marginBottom: 32, lineHeight: 1.7 }}>
                  By submitting this form, you consent to Accurate Designs using the information you provide to respond to your inquiry, as described in our <a href="/privacy" style={{ color: C.orange, textDecoration: "underline", textUnderlineOffset: 3 }}>Privacy Policy</a>.
                </p>
                <Bt'''
          if app.count(form_old) != 1:
              raise SystemExit(f"Expected one contact disclosure insertion point, found {app.count(form_old)}")
          app = app.replace(form_old, form_new, 1)

          privacy_page = r'''
function PrivacyPage() {
  const headingStyle = { ...sf, fontSize: 22, fontWeight: 500, color: C.black, marginBottom: 14, lineHeight: 1.3 };
  const bodyStyle = { ...sn, fontSize: 14.5, fontWeight: 400, color: C.text, lineHeight: 1.85, marginBottom: 16 };

  return (
    <>
      <section style={{ background: C.black, padding: "160px 40px 92px" }}>
        <div style={{ maxWidth: 940, margin: "0 auto", textAlign: "center" }}>
          <F>
            <Lbl light>Privacy</Lbl>
            <Ttl light>Privacy Policy</Ttl>
            <Bd light max={620} style={{ margin: "18px auto 0", textAlign: "center" }}>
              Effective September 10, 2026
            </Bd>
          </F>
        </div>
      </section>

      <Sec py={88} bg={C.warm}>
        <div style={{ maxWidth: 780, margin: "0 auto" }}>
          <F>
            <p style={bodyStyle}>
              Accurate Designs Inc. respects your privacy and is committed to handling personal information responsibly. This policy explains what information we collect through this website, why we collect it, how it may be used or disclosed, and the choices available to you.
            </p>
            <p style={{ ...bodyStyle, marginBottom: 42 }}>
              This policy applies to information collected through accuratedesigns.ca. It does not replace any separate privacy terms that may apply once you enter into a client or professional-services relationship with us.
            </p>
          </F>

          <F delay={0.03}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 8 }}>
              <h2 style={headingStyle}>Information We Collect</h2>
              <p style={bodyStyle}>
                When you submit a project inquiry, we may collect information you choose to provide, including your name, email address, telephone number, project location, project type, service needs, estimated budget range, target timeline, drawing and builder status, how you heard about us, and the project description you enter.
              </p>
              <p style={bodyStyle}>
                If you contact us by email, telephone, or another channel, we may also retain the information contained in that communication as reasonably necessary to respond and manage the relationship.
              </p>
              <p style={bodyStyle}>
                Our website also uses standard technical and analytics information such as browser and device information, pages visited, session activity, approximate location derived from network information, and similar website-usage data.
              </p>
            </div>
          </F>

          <F delay={0.04}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>How We Use Information</h2>
              <p style={bodyStyle}>
                We use personal information to review and respond to inquiries, assess project fit, communicate with prospective and existing clients, schedule consultations, provide requested services, maintain business records, protect the security and integrity of our website, and improve the usefulness and performance of our website and services.
              </p>
              <p style={bodyStyle}>
                We do not sell personal information. We do not use information submitted through the project inquiry form for unrelated marketing purposes without an appropriate basis or consent.
              </p>
            </div>
          </F>

          <F delay={0.05}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Service Providers and Disclosure</h2>
              <p style={bodyStyle}>
                We use third-party service providers to operate parts of this website and our business. Website inquiry submissions are processed through Formspree. Website analytics are provided through Google Analytics. Our website is hosted and deployed using third-party web infrastructure. These providers may process information on our behalf in accordance with their own terms, privacy practices, and contractual obligations.
              </p>
              <p style={bodyStyle}>
                Some service providers may process or store information outside Canada, where it may be subject to the laws of the jurisdiction in which it is processed. We may also disclose information where reasonably necessary to comply with law, protect our legal rights, investigate misuse or security issues, or complete a business transaction involving the company, subject to applicable law.
              </p>
            </div>
          </F>

          <F delay={0.06}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Analytics and Cookies</h2>
              <p style={bodyStyle}>
                We use Google Analytics to understand how visitors use the site and to improve content and performance. Google Analytics may use first-party cookies or similar technologies to distinguish users and sessions and may collect information such as device and browser details, session statistics, pages viewed, and approximate geographic information.
              </p>
              <p style={bodyStyle}>
                You can control or delete cookies through your browser settings. Restricting cookies may affect some website measurement but should not prevent you from viewing the core site or contacting us.
              </p>
            </div>
          </F>

          <F delay={0.07}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Retention and Safeguards</h2>
              <p style={bodyStyle}>
                We retain personal information only for as long as reasonably necessary for the purposes for which it was collected, for legitimate business record-keeping, and to meet legal or regulatory requirements. Retention periods may vary depending on the nature of the information and our relationship with you.
              </p>
              <p style={bodyStyle}>
                We use reasonable administrative, technical, and organizational safeguards appropriate to the nature of the information. No method of electronic transmission or storage is completely secure, so absolute security cannot be guaranteed.
              </p>
            </div>
          </F>

          <F delay={0.08}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Your Choices and Access</h2>
              <p style={bodyStyle}>
                You may contact us to ask about personal information we hold about you, request access to or correction of that information, or raise a concern about our privacy practices. You may also withdraw consent to certain uses of your information, subject to legal, contractual, and reasonable notice requirements. In some circumstances, withdrawing consent may limit our ability to respond to or provide a requested service.
              </p>
            </div>
          </F>

          <F delay={0.09}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Changes to This Policy</h2>
              <p style={bodyStyle}>
                We may update this policy from time to time to reflect changes to our practices, services, technology, or legal obligations. The effective date shown at the top of this page identifies the current version.
              </p>
            </div>
          </F>

          <F delay={0.1}>
            <div style={{ borderTop: `1px solid ${C.faint}`, paddingTop: 34, marginTop: 24 }}>
              <h2 style={headingStyle}>Privacy Contact</h2>
              <p style={bodyStyle}>
                Privacy inquiries, access requests, or concerns may be directed to Brett Lyver, Founder + Principal, Accurate Designs Inc.
              </p>
              <p style={{ ...bodyStyle, whiteSpace: "pre-line" }}>
                {CONTACT_EMAIL}{"\n"}{CONTACT_PHONE}{"\n"}{OFFICE_ADDRESS}
              </p>
            </div>
          </F>
        </div>
      </Sec>
    </>
  );
}

'''
          footer_marker = 'function Footer({ go }) {'
          if app.count(footer_marker) != 1:
              raise SystemExit(f"Expected one footer marker, found {app.count(footer_marker)}")
          app = app.replace(footer_marker, privacy_page + footer_marker, 1)

          footer_old = '''          <span style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)" }}>© 2026 Accurate Designs Inc.</span>
          <span style={{ ...sf, fontSize: 12, fontWeight: 400, fontStyle: "italic", color: "rgba(245,241,235,0.52)", letterSpacing: 0.5 }}>Resolve complexity before it reaches the site.</span>'''
          footer_new = '''          <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 18 }}>
            <span style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)" }}>© 2026 Accurate Designs Inc.</span>
            <a
              href="/privacy"
              onClick={(e) => { e.preventDefault(); go("privacy"); }}
              style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)", textDecoration: "none" }}
            >
              Privacy Policy
            </a>
          </div>
          <span style={{ ...sf, fontSize: 12, fontWeight: 400, fontStyle: "italic", color: "rgba(245,241,235,0.52)", letterSpacing: 0.5 }}>Resolve complexity before it reaches the site.</span>'''
          if app.count(footer_old) != 1:
              raise SystemExit(f"Expected one footer legal block, found {app.count(footer_old)}")
          app = app.replace(footer_old, footer_new, 1)

          pages_old = '''    about: <AboutPage go={go} />,
    contact: <ContactPage go={go} />,
  };'''
          pages_new = '''    about: <AboutPage go={go} />,
    contact: <ContactPage go={go} />,
    privacy: <PrivacyPage />,
  };'''
          if app.count(pages_old) != 1:
              raise SystemExit(f"Expected one pages-map insertion point, found {app.count(pages_old)}")
          app = app.replace(pages_old, pages_new, 1)
          app_path.write_text(app, encoding="utf-8")

          seo_path = Path("src/seo.js")
          seo = seo_path.read_text(encoding="utf-8")
          seo_old = '''  "/contact": {
    title: "Book a Project Consultation | Accurate Designs",
    description:
      "Discuss your custom home, addition, major renovation, feasibility review or owner representation needs with Accurate Designs in the Greater Toronto Area.",
  },
};'''
          seo_new = '''  "/contact": {
    title: "Book a Project Consultation | Accurate Designs",
    description:
      "Discuss your custom home, addition, major renovation, feasibility review or owner representation needs with Accurate Designs in the Greater Toronto Area.",
  },
  "/privacy": {
    title: "Privacy Policy | Accurate Designs",
    description:
      "Learn how Accurate Designs collects, uses, protects and manages information submitted through its website, project inquiry form and website analytics.",
  },
};'''
          if seo.count(seo_old) != 1:
              raise SystemExit(f"Expected one SEO insertion point, found {seo.count(seo_old)}")
          seo = seo.replace(seo_old, seo_new, 1)
          seo_path.write_text(seo, encoding="utf-8")

          sitemap_path = Path("public/sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          sitemap_old = '  <url><loc>https://www.accuratedesigns.ca/contact</loc></url>\n</urlset>'
          sitemap_new = '  <url><loc>https://www.accuratedesigns.ca/contact</loc></url>\n  <url><loc>https://www.accuratedesigns.ca/privacy</loc></url>\n</urlset>'
          if sitemap.count(sitemap_old) != 1:
              raise SystemExit(f"Expected one sitemap insertion point, found {sitemap.count(sitemap_old)}")
          sitemap = sitemap.replace(sitemap_old, sitemap_new, 1)
          sitemap_path.write_text(sitemap, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit privacy and launch cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/seo.js public/sitemap.xml
          git diff --cached --check
          git commit -m "Add privacy policy and launch disclosures"
          git push origin HEAD:main
