name: One-time privacy and launch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-privacy-launch-cleanup.yml"

permissions:
  contents: write

jobs:
  privacy-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire privacy page and disclosures
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/App.jsx")
          app = app_path.read_text(encoding="utf-8")

          import_old = 'import React, { useCallback, useEffect, useRef, useState } from "react";\n'
          import_new = import_old + 'import PrivacyPage from "./PrivacyPage.jsx";\n'
          if app.count(import_old) != 1 or 'import PrivacyPage from "./PrivacyPage.jsx";' in app:
              raise SystemExit("Unexpected PrivacyPage import state")
          app = app.replace(import_old, import_new, 1)

          form_old = (
              '                <p style={{ ...sn, fontSize: 11, fontWeight: 400, color: C.smoke, marginBottom: 32, letterSpacing: 0.3, lineHeight: 1.7 }}>\n'
              '                  Every inquiry is reviewed personally. We typically reply within one business day.\n'
              '                </p>\n'
              '                <Bt'
          )
          form_new = (
              '                <p style={{ ...sn, fontSize: 11, fontWeight: 400, color: C.smoke, marginBottom: 12, letterSpacing: 0.3, lineHeight: 1.7 }}>\n'
              '                  Every inquiry is reviewed personally. We typically reply within one business day.\n'
              '                </p>\n'
              '                <p style={{ ...sn, fontSize: 10.5, fontWeight: 400, color: C.muted, marginBottom: 32, lineHeight: 1.7 }}>\n'
              '                  By submitting this form, you consent to Accurate Designs using the information you provide to respond to your inquiry, as described in our <a href="/privacy" style={{ color: C.orange, textDecoration: "underline", textUnderlineOffset: 3 }}>Privacy Policy</a>.\n'
              '                </p>\n'
              '                <Bt'
          )
          if app.count(form_old) != 1:
              raise SystemExit(f"Expected one contact disclosure insertion point, found {app.count(form_old)}")
          app = app.replace(form_old, form_new, 1)

          footer_old = (
              '          <span style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)" }}>© 2026 Accurate Designs Inc.</span>\n'
              '          <span style={{ ...sf, fontSize: 12, fontWeight: 400, fontStyle: "italic", color: "rgba(245,241,235,0.52)", letterSpacing: 0.5 }}>Resolve complexity before it reaches the site.</span>'
          )
          footer_new = (
              '          <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", gap: 18 }}>\n'
              '            <span style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)" }}>© 2026 Accurate Designs Inc.</span>\n'
              '            <a href="/privacy" onClick={(e) => { e.preventDefault(); go("privacy"); }} style={{ ...sn, fontSize: 11, fontWeight: 400, color: "rgba(245,241,235,0.58)", textDecoration: "none" }}>\n'
              '              Privacy Policy\n'
              '            </a>\n'
              '          </div>\n'
              '          <span style={{ ...sf, fontSize: 12, fontWeight: 400, fontStyle: "italic", color: "rgba(245,241,235,0.52)", letterSpacing: 0.5 }}>Resolve complexity before it reaches the site.</span>'
          )
          if app.count(footer_old) != 1:
              raise SystemExit(f"Expected one footer legal block, found {app.count(footer_old)}")
          app = app.replace(footer_old, footer_new, 1)

          pages_old = (
              '    about: <AboutPage go={go} />,\n'
              '    contact: <ContactPage go={go} />,\n'
              '  };'
          )
          pages_new = (
              '    about: <AboutPage go={go} />,\n'
              '    contact: <ContactPage go={go} />,\n'
              '    privacy: <PrivacyPage />,\n'
              '  };'
          )
          if app.count(pages_old) != 1:
              raise SystemExit(f"Expected one pages-map insertion point, found {app.count(pages_old)}")
          app = app.replace(pages_old, pages_new, 1)
          app_path.write_text(app, encoding="utf-8")

          seo_path = Path("src/seo.js")
          seo = seo_path.read_text(encoding="utf-8")
          seo_old = (
              '  "/contact": {\n'
              '    title: "Book a Project Consultation | Accurate Designs",\n'
              '    description:\n'
              '      "Discuss your custom home, addition, major renovation, feasibility review or owner representation needs with Accurate Designs in the Greater Toronto Area.",\n'
              '  },\n'
              '};'
          )
          seo_new = (
              '  "/contact": {\n'
              '    title: "Book a Project Consultation | Accurate Designs",\n'
              '    description:\n'
              '      "Discuss your custom home, addition, major renovation, feasibility review or owner representation needs with Accurate Designs in the Greater Toronto Area.",\n'
              '  },\n'
              '  "/privacy": {\n'
              '    title: "Privacy Policy | Accurate Designs",\n'
              '    description:\n'
              '      "Learn how Accurate Designs collects, uses, protects and manages information submitted through its website, project inquiry form and website analytics.",\n'
              '  },\n'
              '};'
          )
          if seo.count(seo_old) != 1:
              raise SystemExit(f"Expected one SEO insertion point, found {seo.count(seo_old)}")
          seo = seo.replace(seo_old, seo_new, 1)
          seo_path.write_text(seo, encoding="utf-8")

          sitemap_path = Path("public/sitemap.xml")
          sitemap = sitemap_path.read_text(encoding="utf-8")
          sitemap_old = '  <url><loc>https://www.accuratedesigns.ca/contact</loc></url>\n</urlset>'
          sitemap_new = '  <url><loc>https://www.accuratedesigns.ca/contact</loc></url>\n  <url><loc>https://www.accuratedesigns.ca/privacy</loc></url>\n</urlset>'
          if sitemap.count(sitemap_old) != 1:
              raise SystemExit(f"Expected one sitemap insertion point, found {sitemap.count(sitemap_old)}")
          sitemap = sitemap.replace(sitemap_old, sitemap_new, 1)
          sitemap_path.write_text(sitemap, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit privacy and launch cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/seo.js public/sitemap.xml
          git diff --cached --check
          git commit -m "Add privacy policy and launch disclosures"
          git push origin HEAD:main
